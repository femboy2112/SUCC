name: APOLLO source-first prime interference

on:
  push:
    branches:
      - 'research/apollo-prime-interference-source-determinacy-*'
  pull_request:
    paths:
      - 'observational_succ/apollo_source_first_interference.py'
      - 'tests/test_apollo_source_first_interference.py'
      - 'tests/test_apollo_source_first_authentic.py'
      - 'scripts/apollo_source_first_interference_probe.py'
      - 'research/2026-10-15/APOLLO_SOURCE_FIRST_INTERFERENCE_RECEIPT.json'
      - '.github/workflows/apollo-source-first-interference.yml'

jobs:
  source-first-prime-brownian:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Exact prime shift recovery and ± phase hostile controls
        run: python -m unittest discover -s tests -p 'test_apollo_source_first_interference.py' -v
      - name: True source prime2, real Gamma and full negative bounded graph
        run: python -m unittest discover -s tests -p 'test_apollo_source_first_authentic.py' -v
      - name: Original source deterministic no-zero receipt
        run: python scripts/apollo_source_first_interference_probe.py --verify
      - name: Inherited APOLLO signed source feature regression
        run: python -m unittest discover -s tests -p 'test_apollo_krein_factor.py' -v
      - name: Inherited Tate prime-clock and gamma certificate regression
        run: python -m unittest discover -s tests -p 'test_tate_prime_clock_uv.py' -v
      - name: Inherited Schur source positive/negative gluing regression
        run: python -m unittest discover -s tests -p 'test_source_field_gluing.py' -v
      - name: Verify immutable imported source provenance
        run: python scripts/verify_provenance.py
