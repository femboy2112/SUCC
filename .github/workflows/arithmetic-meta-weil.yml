name: Arithmetic Meta-SUCC authentic Weil finite certificates

on:
  push:
    branches:
      - 'research/arithmetic-meta-weil-*'
    paths:
      - 'observational_succ/arithmetic_meta_weil.py'
      - 'tests/test_arithmetic_meta_weil.py'
      - 'scripts/arithmetic_meta_weil_probe.py'
      - 'research/2026-10-14/ARITHMETIC_META_WEIL*'
      - 'docs/CLAIM_SUPPLEMENT_ARITHMETIC_META_WEIL.md'
      - '.github/workflows/arithmetic-meta-weil.yml'
  pull_request:
    paths:
      - 'observational_succ/arithmetic_meta_weil.py'
      - 'tests/test_arithmetic_meta_weil.py'
      - 'scripts/arithmetic_meta_weil_probe.py'
      - 'research/2026-10-14/ARITHMETIC_META_WEIL*'
      - 'docs/CLAIM_SUPPLEMENT_ARITHMETIC_META_WEIL.md'
      - '.github/workflows/arithmetic-meta-weil.yml'
  workflow_dispatch:

jobs:
  source-analytic-moment-certificate:
    name: Exact source and signed Weil subspace (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Optional high-precision independent source oracle
        run: python -m pip install 'mpmath>=1.2,<2'
      - name: Preserve imported-source Git provenance
        run: python scripts/verify_provenance.py
      - name: Exact arithmetic, boundary commutator and first-prime high-moment theorem
        run: PYTHONPATH=. python -m unittest tests.test_arithmetic_meta_weil -v
      - name: Byte-exact reproducible mathematical source receipt
        run: PYTHONPATH=. python scripts/arithmetic_meta_weil_probe.py --verify research/2026-10-14/ARITHMETIC_META_WEIL_RECEIPT.json
      - name: Source and RH claim firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fractions import Fraction
          j=json.loads(Path('research/2026-10-14/ARITHMETIC_META_WEIL_RECEIPT.json').read_text())
          assert j['RH_proved'] is False
          assert j['physical_source_authenticated'] is False
          assert j['first_prime_101_moment_infinite_dimensional_weil']['certified_all_test_margin'] == '291/5000'
          assert j['improved_30_moment_infinite_dimensional_weil']['certified_all_test_margin'] == '369/10000'
          assert j['true_prime2_continuum_window_commutator']['commutator_norm_strictly_greater_than'] == '3/22'
          assert j['global_prime_gamma_holonomy'].startswith('FLAT')
          assert j['finite_window_2log2_discrete_control']['continuum_Galerkin_claimed'] is False
          PY
