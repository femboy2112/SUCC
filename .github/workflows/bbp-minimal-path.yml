name: BBP minimal-path source and spectral hostile checks
on:
  pull_request:
    paths:
      - 'observational_succ/bbp_minimal_path.py'
      - 'observational_succ/bbp_cyclotomic_spectral.py'
      - 'tests/test_bbp_minimal_path.py'
      - 'scripts/bbp_minimal_path_probe.py'
      - 'research/2026-10-24/BBP_MINIMAL_PATH_*'
      - 'docs/CLAIM_SUPPLEMENT_BBP_MINIMAL_PATH.md'
      - '.github/workflows/bbp-minimal-path.yml'
  workflow_dispatch:
jobs:
  exact-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package editable
        run: python -m pip install -e .
      - name: Focused exact-source and finite spectral tests
        run: python -m unittest discover -s tests -p 'test_bbp_minimal_path.py' -v
      - name: Deterministic finite oracle and exact receipt
        run: |
          python scripts/bbp_minimal_path_probe.py --output /tmp/bbp-minimal-path.json
          cmp /tmp/bbp-minimal-path.json research/2026-10-24/BBP_MINIMAL_PATH_FINITE_RECEIPT.json
      - name: Source provenance
        run: python scripts/verify_provenance.py
