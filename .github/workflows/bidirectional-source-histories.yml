name: Bidirectional source history exact controls
on:
  pull_request:
    paths:
      - 'observational_succ/bidirectional_source_histories.py'
      - 'tests/test_bidirectional_source_histories.py'
      - 'scripts/bidirectional_source_histories_probe.py'
      - 'research/2026-10-22/BIDIR_SOURCE_HISTORIES_RECEIPT.json'
      - '.github/workflows/bidirectional-source-histories.yml'
  workflow_dispatch:

jobs:
  exact-source-history:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused old/new exact tests and pinned source probe
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_growing_dtn_history.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_bidirectional_source_histories.py' -v
          PYTHONPATH=. python scripts/growing_dtn_history_probe.py
          PYTHONPATH=. python scripts/bidirectional_source_histories_probe.py --verify-receipt
      - name: Import provenance invariants
        run: PYTHONPATH=. python scripts/verify_provenance.py
