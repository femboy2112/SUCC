name: Boundary-port geometry selection (exact rational)
on:
  push:
    branches:
      - research/boundary-port-geometry-selection-2026-10-22
  pull_request:
    paths:
      - "observational_succ/boundary_port_geometry.py"
      - "tests/test_boundary_port_geometry.py"
      - "scripts/boundary_port_geometry_probe.py"
      - "research/2026-10-22/BOUNDARY_PORT_GEOMETRY_EXACT_RECEIPT.json"
      - ".github/workflows/boundary-port-geometry.yml"
  workflow_dispatch:
jobs:
  rational-ports:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact hostile port/category suite
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_boundary_port_geometry.py' -v
      - name: Pinned exact rational source receipt
        env:
          PYTHONPATH: .
        run: python scripts/boundary_port_geometry_probe.py --check
      - name: Existing historical source provenance
        env:
          PYTHONPATH: .
        run: python scripts/verify_provenance.py
      - name: Install optional inherited probe dependency
        run: python -m pip install 'mpmath>=1.3,<2'
      - name: Historical observer and ordinal contract
        env:
          PYTHONPATH: .
        run: |
          python scripts/observer_foundations_probe.py
          python scripts/ordinal_succ_report_probe.py
