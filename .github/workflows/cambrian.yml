name: Cambrian exact source and receipt checks

on:
  push:
    branches:
      - 'research/cambrian-*'
  pull_request:
    paths:
      - 'observational_succ/cambrian*.py'
      - 'tests/test_cambrian*.py'
      - 'scripts/cambrian*.py'
      - 'research/2026-10-13/CAMBRIAN*'
      - 'research/2026-10-13/cambrian*'
      - '.github/workflows/cambrian.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - name: Reproduce campaign and hostile controls
        run: python -m unittest discover -s tests -p 'test_cambrian*.py' -v
      - name: Replay frozen mathematics with explicit runtime metadata
        run: python scripts/cambrian_campaign_verify.py
