name: Carrier Tate Weil source reconstruction

on:
  push:
    branches: ['research/carrier-tate-weil-*']
  pull_request:
    paths:
      - 'observational_succ/tate_idelic_zeta.py'
      - 'observational_succ/tate_chi4.py'
      - 'observational_succ/tate_weil_distribution.py'
      - 'observational_succ/tate_positivity_obstruction.py'
      - 'tests/test_carrier_poisson_audit.py'
      - 'tests/test_tate_idelic_zeta.py'
      - 'tests/test_tate_chi4.py'
      - 'tests/test_tate_weil_distribution.py'
      - 'tests/test_tate_positivity_obstruction.py'
      - 'scripts/carrier_tate_weil_probe.py'
      - '.github/workflows/carrier-tate-weil.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carrier-tate-weil-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Carrier Tate Weil (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - name: Preserve archived provenance
        run: python scripts/verify_provenance.py
      - name: Recheck inherited Poisson and new Tate Weil interfaces
        run: |
          python - <<'PY'
          import unittest
          names = [
              'pontryagin_source_duality', 'finite_adelic_character_bridge',
              'pontryagin_tate_atlas', 'finite_cyclic_poisson',
              'adelic_solenoid_duality', 'adelic_poisson_reconstruction',
              'adelic_gaussian_interval', 'carrier_poisson_audit',
              'tate_idelic_zeta', 'tate_chi4', 'tate_weil_distribution',
              'tate_positivity_obstruction',
          ]
          suite = unittest.TestSuite()
          for name in names:
              suite.addTests(unittest.defaultTestLoader.discover('tests', pattern='test_'+name+'.py'))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Replay exact source receipt
        run: |
          python scripts/carrier_tate_weil_probe.py > "$RUNNER_TEMP/carrier-tate-weil.json"
          diff -u research/2026-10-15/CARRIER_TATE_WEIL_RECEIPT.json "$RUNNER_TEMP/carrier-tate-weil.json"
      - uses: actions/upload-artifact@v4
        with:
          name: carrier-tate-weil-${{ matrix.python-version }}
          path: ${{ runner.temp }}/carrier-tate-weil.json
