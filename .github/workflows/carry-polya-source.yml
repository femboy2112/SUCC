name: BBP resolvent and source-locked observer proofs

on:
  push:
    branches: ['research/bbp-resolvent-observer-rigidity-*']
  pull_request:
    paths:
      - 'observational_succ/bbp_dirichlet_resolvent.py'
      - 'observational_succ/divisor_observer_spectrum.py'
      - 'observational_succ/polya_coherent_observer.py'
      - 'scripts/check_carry_polya_*.py'
      - 'scripts/build_math_memory.py'
      - 'scripts/bbp_dirichlet_resolvent_oracle.py'
      - 'scripts/divisor_observer_spectrum_probe.py'
      - 'scripts/polya_coherence_oracle.py'
      - 'formal/DivisorBoundary.lean'
      - 'formal/PolyaCoherence.lean'
      - 'tests/test_bbp_dirichlet_resolvent.py'
      - 'tests/test_divisor_observer_spectrum.py'
      - 'tests/test_polya_coherent_observer.py'
      - 'tests/test_math_memory.py'
      - 'research/2026-10-28/**'
      - '.github/workflows/carry-polya-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carry-polya-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Exact source and hostile replay (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - name: Provenance, native probes, exact source and independent oracles
        run: python scripts/check_carry_polya_source.py --output "$RUNNER_TEMP/carry-polya-source"
      - name: Verify regenerated mathematical discovery catalog
        run: python scripts/build_math_memory.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carry-polya-source-${{ matrix.python }}
          path: ${{ runner.temp }}/carry-polya-source/

  lean:
    name: Lean boundary and Polya algebra with negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install hash-verified Lean 4.14.0
        run: |
          set -euo pipefail
          curl --fail -L https://github.com/leanprover/lean4/releases/download/v4.14.0/lean-4.14.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "320f18e7d58271d95fced740522b5a5ed41b85b2af5bf0e8ab9a8dbc380e450a  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --no-same-owner --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.14.0-linux/bin" >> "$GITHUB_PATH"
      - name: Retrieve only pinned dependencies needed by the two proofs
        working-directory: formal/mathlib_bridge
        run: lake exe cache get Mathlib/Data/Real/Basic.lean Mathlib/Algebra/BigOperators/Ring.lean Mathlib/Data/Nat/Defs.lean Mathlib/Tactic/Ring.lean Mathlib/Tactic/NormNum.lean
      - name: Serial kernel checks, proposition and axiom exports, false controls
        run: python scripts/check_carry_polya_lean.py --output "$RUNNER_TEMP/carry-polya-lean"
      - name: Downloaded Lean cache must not change the research catalog
        run: python scripts/build_math_memory.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carry-polya-lean
          path: ${{ runner.temp }}/carry-polya-lean/
