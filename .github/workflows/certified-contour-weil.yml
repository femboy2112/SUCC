name: Certified contour and Weil source
on:
  push:
    branches:
      - 'research/certified-contour-suzuki-*'
  pull_request:
    paths:
      - 'observational_succ/certified_contour_weil.py'
      - 'tests/test_certified_contour_weil.py'
      - 'tests/fixtures/XI_PARENT_SOURCE_OUTER_INTERVALS.json'
      - 'scripts/certified_contour_weil_probe.py'
      - 'research/2026-10-14/CERTIFIED_CONTOUR*'
      - '.github/workflows/certified-contour-weil.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact SUCC package
        run: python -m pip install -e '.[test]'
      - name: Rational winding, source and hostile contour tests
        run: python -m unittest discover -s tests -p 'test_certified_contour_weil.py' -v
      - name: Frozen rational scientific receipt must replay
        run: python scripts/certified_contour_weil_probe.py --verify research/2026-10-14/CERTIFIED_CONTOUR_WEIL_RECEIPT.json
      - name: Immutable original theta source must authenticate — no skips
        run: python scripts/certified_contour_weil_probe.py --authenticate-parent
      - name: Repository source-provenance gate
        run: python scripts/verify_provenance.py
