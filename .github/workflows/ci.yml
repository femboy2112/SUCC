  heuristic-source-verification:
    name: Contextual Bayesian SUCC heuristic guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verified research dependencies
        run: python -m pip install -e ".[test]"
      - name: Exact heuristic and source-provenance tests
        run: python -m unittest discover -s tests -p 'test_*heuristic*.py' -v
      - name: Independently rederive stored Bayesian-source receipt
        run: |
          python scripts/contextual_heuristic_probe.py > "$RUNNER_TEMP/contextual-heuristic.json"
          diff -u research/2026-10-12/CONTEXTUAL_HEURISTIC_RECEIPT.json "$RUNNER_TEMP/contextual-heuristic.json"

