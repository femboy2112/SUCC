name: Observational SUCC validation

on:
  push:
    branches:
      - main
      - 'research/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obs-succ-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} mathematical and epistemic checks
    runs-on: ubuntu-latest
    # The 9,677-test suite exceeded 25 minutes on the Python 3.10 hosted runner.
    # Keep a finite allowance for the full suite and the source replays below.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          # The theorem registry authenticates historical and sibling source commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install research and test extras
        run: python -m pip install -e ".[test]"
      - name: Verify source Git blob provenance
        run: python scripts/verify_provenance.py
      - name: Verify Academic Main VII ancestry, namespaces and admitted propositions
        run: |
          python scripts/academic_main_vii_gate.py > "$RUNNER_TEMP/academic-main-vii.json"
          python scripts/academic_main_viii_gate.py > "$RUNNER_TEMP/academic-main-viii.json"
          python scripts/verify_duck_pi_dependencies.py
          python scripts/main_vii_hostile_replay.py --target-repo . --require-fixed > "$RUNNER_TEMP/academic-main-vii-hostile.json"
      - name: Check carrier-relative ontology, proof policy and E meta tower receipts
        run: |
          python scripts/carrier_relative_frontier_probe.py > "$RUNNER_TEMP/carrier-relative.json"
          python scripts/checkpoint_meta_tower_probe.py > "$RUNNER_TEMP/checkpoint-meta.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ["RUNNER_TEMP"])/"carrier-relative.json").read_text())
          b=json.loads((Path(os.environ["RUNNER_TEMP"])/"checkpoint-meta.json").read_text())
          assert a["ontology_pair_same_history_all_policies"] is True
          assert a["original_parity_uniformly_decidable"] is False
          assert a["hankel"]["verified_min_linear_state_dimension"] == 2
          assert a["finite_horizon_internalization"]["all_observed_joint_probabilities_equal"] is True
          assert b["destructive_full_order_enumeration"] == "MODEL_CERTIFIED_NO_FINITE_POLICY"
          assert b["adaptive_succeeds_where_fixed_length_two_fails"] is True
          assert b["conditional_worst_case_depth"] == 2
          assert b["rule_growth_from_old_evidence"] == [False,True]
          assert b["rule_growth_requires_new_empirical_events"] is False
          assert b["checkpoint_e_knowledge"] == [{"index":1,"proved":False},{"index":2,"proved":True}]
          assert b["source_authentication_claimed"] is False and b["physical_infinity_completed"] is False
          assert a["RH_or_archimedean_identification_claimed"] is False and b["RH_claimed"] is False
          PY
      - name: Run all mathematical, logic, quantum, source and hostile tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Replay Euler--Mascheroni exact source and completed-Li certificates
        run: python scripts/euler_mascheroni_probe.py --verify research/2026-10-24/euler_mascheroni_validation/probe_receipt.json
      - name: Replay exact categorical repair and cross-model bridge receipt
        run: |
          python scripts/categorical_model_bridge_probe.py > "$RUNNER_TEMP/categorical-model-bridge.json"
          diff -u research/2026-10-12/CATEGORICAL_MODEL_BRIDGE_RECEIPT.json "$RUNNER_TEMP/categorical-model-bridge.json"
      - name: Replay exact source-driven RC inverse reconstruction receipt
        run: python scripts/dynamic_boundary_inverse_probe.py > "$RUNNER_TEMP/dynamic-boundary-inverse.json"
      - name: Reconstruct the historical Galilean-to-Lorentz SUCC repair
        run: |
          python scripts/historical_galilean_lorentz_probe.py > "$RUNNER_TEMP/historical-galileo-lorentz.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"historical-galileo-lorentz.json").read_text())
          r=d["results"]
          assert r["mechanical_old_field_positive"]["free_particle_law_preserved"] is True
          assert r["galilean_obstruction"]["galilean_quadratic_wave_failure"]=="-42/25"
          assert r["galilean_obstruction"]["galilean_operator_defect"]==[["0","-3/5"],["-3/5","9/25"]]
          assert r["galilean_obstruction"]["lorentz_operator_defect"]==[["0","0"],["0","0"]]
          assert r["galilean_obstruction"]["two_light_rays_clock_sufficient"] is True
          assert r["distributed_metric_shadows"]["insufficient"]["status"]=="UNRESOLVED"
          assert r["distributed_metric_shadows"]["constructed"]["status"]=="GLOBAL_GEOMETRY_CONSTRUCTED"
          assert r["distributed_metric_shadows"]["constructed"]["metric"]==[["1","0"],["0","-1"]]
          assert r["transverse_maxwell_subsystem"]["maxwell_sector_covariance"] is True
          assert r["transverse_maxwell_subsystem"]["galilean_principal_trace"]=="-6/5"
          assert r["moving_medium_counter_repair"]["same_form_vacuum_operator"] is False
          assert d["empirical_source_authentication"] is False
          assert d["RH_or_Weil_positivity_proved"] is False
          PY
