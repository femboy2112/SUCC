        run: |
          python scripts/coverage_sieve_crt_probe.py > "$RUNNER_TEMP/coverage-sieve-crt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"coverage-sieve-crt.json").read_text())
          assert r["period"]==65 and r["sieve_survivors"]==2304
          assert [x["chi2"] for x in r["factors"]]==["1/4","1/4","1/12","1/12"]
          assert [x["bad_count"] for x in r["factors"]]==[1,1,1,1]
