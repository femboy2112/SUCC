          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"coverage-lower-bounds.json").read_text())
          assert report["rational_probabilities_only"] is True
          assert report["gaussian_moat_all_D_from_succ"] is False
          assert report["gaussian_full_grid_control"]["samples"] == 4225
          assert all(x["chi2"]=="0" for x in report["gaussian_full_grid_control"]["all_signed_coordinates"])
          assert report["gaussian_short_window_negative"]["uncovered_residues"] == 9
          assert report["batch_joint_collision"]["coordinate_fraction_lower"] == "24/25"
          assert report["source_dependent_update_control"]["terminal_chi2"] == "4"
          PY
