name: Observational SUCC validation

on:
  push:
    branches:
      - main
      - 'research/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obs-succ-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} mathematical and epistemic checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install research and test extras
        run: python -m pip install -e ".[test]"
      - name: Verify source Git blob provenance
        run: python scripts/verify_provenance.py
      - name: Run all mathematical, logic, quantum, source and hostile tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prove observer-to-semantic distinguishability contraction
        run: |
          python scripts/semantic_data_processing_probe.py > "$RUNNER_TEMP/semantic-data-processing.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"semantic-data-processing.json").read_text())
          assert j["status"]=="EXACT_SEMANTIC_DATA_PROCESSING"
          assert j["Z_outcomes_0_vs_1_TV"]=="1"
          assert j["X_outcomes_0_vs_1_TV"]=="0"
          assert j["Z_forgotten_TV"]=="0"
          assert j["source_causal_records_erased"] is False
          assert j["Weil_positivity_claimed"] is False
          PY
      - name: Source-faithful observer trap and lawful repair receipt
        run: |
          python scripts/observer_trap_probe.py > "$RUNNER_TEMP/observer-trap.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"observer-trap.json").read_text())
          assert j["status"]=="FINITE_OBSERVER_TRAP_CERTIFIED"
          assert j["model_access_trap"]=="access-trap"
          assert j["five_succ_updates_compatible"]==["A","B"]
          assert j["external_intervention_identified"] is True
          assert j["compatible_union_identified"] is True
          assert j["round_robin_first_refutation_succ"]==2
          assert j["source_records_rewritten"] is False
          assert j["physical_cognition_claimed"] is False
          assert j["RH_or_Godel_independence_claimed"] is False
          PY
      - name: Absorbing Hard SUCC, constructive limit and finite communication
        run: |
          python scripts/absorbing_frontier_probe.py > "$RUNNER_TEMP/absorbing-frontier.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"absorbing-frontier.json").read_text())
          assert j["status"]=="ABSORBING_SUCC_FINITE_THEOREM_CONTROLS"
          assert j["absorbing"]["full_hard_succ_identified"] is True
          assert j["absorbing"]["physical_barrier_remaining_candidates"]==["A","B"]
          assert j["constructive_logic"]["root_forces_P_or_not_P"] is False
          assert j["constructive_logic"]["classical_excluded_middle_invalidated"] is False
          assert j["omega_limit"]["omega_plus_one_contains_seal"] is True
          assert j["omega_limit"]["physical_infinite_iteration_executed"] is False
          assert j["finite_channel"]["minimum_fixed_width_bits"]==1
          assert j["finite_channel"]["naive_sender_id_fixed_width_bits"]==2
          assert j["unrestricted_real_exact_bit_transmission_claimed"] is False
          assert j["RH_claimed"] is False
          PY
      - name: Knowledge-aided SUCC interobserver ladder and future-transport controls
        run: |
          python scripts/knowledge_ladder_probe.py > "$RUNNER_TEMP/knowledge-ladder.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"knowledge-ladder.json").read_text())
          assert j["status"]=="EXACT_FINITE_INTEROBSERVER_KNOWLEDGE_LADDER"
          assert j["discovery_succ_steps"]==6
          assert j["receiver_knowledge_aided_steps"]==3
          assert j["end_source_class"]==["B"]
          assert j["complementarity"]["status"]=="EXACT_DISTRIBUTED_EPISTEMIC_COMPLEMENTARITY"
          assert j["complementarity"]["alice_only_xor_identified"] is False
          assert j["complementarity"]["bob_only_xor_identified"] is False
          assert j["complementarity"]["shared_source"]==["10"]
          assert j["complementarity"]["shared_xor"]=="1"
          assert j["cross_enabled_ladder"]["status"]=="EXACT_CROSS_ENABLED_SUCC_LADDER"
          assert j["cross_enabled_ladder"]["isolated_alice_sources"]==["A","B"]
          assert j["cross_enabled_ladder"]["isolated_bob_sources"]==["A","B"]
          assert j["cross_enabled_ladder"]["collective_sources"]==["B"]
          assert j["cross_enabled_ladder"]["alternating_probes"]==["p0","p1","p2","p3"]
          assert j["cross_enabled_ladder"]["full_history_and_semantic_alignment"] is True
          assert j["cross_enabled_ladder"]["physical_instruments_replicated"] is False
          assert j["complementarity"]["full_continuation_equivalence_of_physical_devices_claimed"] is False
          assert j["full_shared_semantics_and_causal_records_match"] is True
          assert [r["local_discovery_steps"] for r in j["rungs"]]==[2,2,2]
          assert [r["receiver_informed_steps"] for r in j["rungs"]]==[1,1,1]
          assert j["sender_outcomes_cryptographically_authenticated"] is False
          assert j["physical_time_speedup_proved"] is False
          assert j["infinite_ladder_executed"] is False
          assert j["RH_claimed"] is False
          PY
      - name: Relative path value deltas and proof-shaped probes
        run: |
          python scripts/relative_delta_probe.py > "$RUNNER_TEMP/relative-delta.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"relative-delta.json").read_text())
          assert j["status"]=="EXACT_FINITE_RELATIVE_OBSERVER_TRANSPORT"
          assert j["relative_path_value"]["no_state_snapshot_or_absolute_probe_names_in_steps"] is True
          assert j["position_anchored"]["independent_prior_histories"] is True
          assert j["position_anchored"]["same_prior_knowledge_access_and_reasoning"] is True
          assert j["position_anchored"]["operational_continuation_verified"] is True
          assert j["position_anchored"]["old_receiver_event_origin_preserved"]=="Bob"
          assert j["position_anchored"]["relative_informed_steps"]==1
          assert j["evolving_proof_basis"]["new_physical_instrument_created"] is False
          assert j["evolving_proof_basis"]["option_alone_determined_result"] is False
          assert j["evolving_proof_basis"]["conditional_probe_plan_valid_for_every_possible_outcome"] is True
          assert j["evolving_proof_basis"]["conditional_probe_plan_physically_available"] is False
          assert j["evolving_proof_basis"]["proof_after_primitive_evidence_determined_result"] is True
          assert j["evolving_proof_basis"]["parity_physically_observed"] is False
          assert j["evolving_proof_basis"]["frozen_base_minimum_worst_case_bits_for_eight_arbitrary_bits"]==8
          assert j["arbitrary_infinite_completion_transmitted"] is False
          assert j["RH_claimed"] is False
          PY
      - name: Cross-language circle algebra and path witness calibration
        run: |
          python scripts/circle_translation_probe.py > "$RUNNER_TEMP/circle-translator.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"circle-translator.json").read_text())
          assert j["status"]=="EXACT_CIRCLE_POLYNOMIAL_TRIG_TRANSLATOR"
          assert j["coordinate_ring_identity_zero"] is True
          assert j["trigonometric_polynomial_identity_zero"] is True
          assert j["angular_derivations_intertwine"] is True
          assert j["global_angular_one_form_coefficient_one"] is True
          assert j["global_single_valued_real_angle_claimed"] is False
          assert j["group_law_preserved"] is True
          assert j["orientation_requires_explicit_calibration"] is True
          assert j["reflected_winding_sign_inverted"] is True
          assert j["identical_finite_phase_samples"] is True
          assert j["different_true_winding_numbers"] is True
          assert j["pairwise_rational_time_separator"]=="1/5"
          assert j["all_rational_times_identify_integer_winding_ideal_theorem"] is True
          assert j["any_fixed_finite_rational_sample_family_identifies_unbounded_winding"] is False
          assert j["infinite_rational_probe_sequence_executed"] is False
          assert j["matching_sampled_windings"]==[1,5]
          assert j["full_path_observability_proved_by_samples"] is False
          assert j["general_two_theory_translation_proved"] is False
          assert j["RH_claimed"] is False
          PY
      - name: General SUCC CLI
        run: python -m observational_succ demo --output "$RUNNER_TEMP/observer-demo.json"
      - name: Gödel, Turing and ordinal proof evidence
        run: python scripts/observer_foundations_probe.py --output "$RUNNER_TEMP/foundations.json"
      - name: Retrospective ordinal correlation
        run: python scripts/ordinal_succ_report_probe.py --output "$RUNNER_TEMP/ordinal.json"
      - name: Certified source-side RH bridge
        run: python scripts/prime_source_certificates_probe.py --output "$RUNNER_TEMP/prime-source.json"
      - name: Persist verified finite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-succ-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/observer-demo.json
            ${{ runner.temp }}/foundations.json
            ${{ runner.temp }}/ordinal.json
            ${{ runner.temp }}/prime-source.json
            ${{ runner.temp }}/semantic-data-processing.json
            ${{ runner.temp }}/observer-trap.json
            ${{ runner.temp }}/absorbing-frontier.json
            ${{ runner.temp }}/knowledge-ladder.json
            ${{ runner.temp }}/relative-delta.json
            ${{ runner.temp }}/circle-translator.json
          if-no-files-found: warn
          retention-days: 14
