name: circle-gamma-prime-digit-bridge

on:
  pull_request:
    paths:
      - "observational_succ/circle_gamma_prime_digits.py"
      - "tests/test_circle_gamma_prime_digits.py"
      - "scripts/circle_gamma_prime_digits_probe.py"
      - "research/2026-10-21/CIRCLE_GAMMA_PRIME_DIGIT_TRANSPORT.md"
      - "research/2026-10-21/CIRCLE_GAMMA_PRIME_DIGITS_FINITE_RECEIPT.json"
      - "docs/CLAIM_SUPPLEMENT_CIRCLE_GAMMA_PRIME_DIGITS.md"
      - ".github/workflows/circle-gamma-prime-digit-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-circle-prime:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile exact finite bridge
        run: python -m compileall -q observational_succ/circle_gamma_prime_digits.py tests/test_circle_gamma_prime_digits.py scripts/circle_gamma_prime_digits_probe.py
      - name: Exact hostile unit tests
        run: python -m unittest discover -s tests -p 'test_circle_gamma_prime_digits.py' -v
      - name: Frozen exact finite receipt
        run: |
          python scripts/circle_gamma_prime_digits_probe.py --output /tmp/cgpd.json
          cmp /tmp/cgpd.json research/2026-10-21/CIRCLE_GAMMA_PRIME_DIGITS_FINITE_RECEIPT.json
      - name: Truth-claim guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('research/2026-10-21/CIRCLE_GAMMA_PRIME_DIGITS_FINITE_RECEIPT.json').read_text())
          bound=receipt['proof_boundaries']
          assert bound['pi_normality_proved'] is False
          assert bound['RH_proved'] is False
          assert bound['RH_to_pi_phase_transference_proved'] is False
          assert bound['phase_mixed_terms_required'] is True
          assert receipt['phase_cocycle']['mixed_angle']=='2/7'
          PY
