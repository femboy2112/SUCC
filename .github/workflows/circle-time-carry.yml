name: Circle time-carry and 3-adic resonance exact research
on:
  push:
    branches:
      - research/circle-time-carry-3adic-resonance-2026-10-23
  pull_request:
    paths:
      - 'observational_succ/circle_time_carry.py'
      - 'tests/test_circle_time_carry.py'
      - 'research/2026-10-23/CIRCLE_TIME_CARRY_RESONANCE.md'
      - 'scripts/circle_time_carry_probe.py'
      - '.github/workflows/circle-time-carry.yml'
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install repo test dependencies
        run: python -m pip install -e '.[test]'
      - name: Python syntax and exact hostile regression
        run: |
          python -Werror -m py_compile observational_succ/circle_time_carry.py tests/test_circle_time_carry.py scripts/circle_time_carry_probe.py
          python -m unittest discover -s tests -p 'test_circle_time_carry.py' -v
          python scripts/circle_time_carry_probe.py --check
      - name: Historical source and observer foundations
        run: |
          python scripts/verify_provenance.py
          python scripts/observer_foundations_probe.py
