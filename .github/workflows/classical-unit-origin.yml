name: Classical SUCC unit-origin and Mellin boundary

on:
  push:
    branches:
      - research/classical-affine-carrier-2026-10-15
  pull_request:
    paths:
      - 'observational_succ/classical_unit_origin.py'
      - 'tests/test_classical_unit_origin.py'
      - 'scripts/classical_unit_origin_probe.py'
      - 'research/2026-10-15/CLASSICAL_UNIT_ORIGIN_RECEIPT.json'
      - '.github/workflows/classical-unit-origin.yml'
  workflow_dispatch:

jobs:
  classical-source-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version ${{
      - name: Exact independent classical tests
        run: python -m unittest discover -s tests -p 'test_classical_unit_origin.py' -v
      - name: Recompute receipt, reject drift
        run: python scripts/classical_unit_origin_probe.py --verify
      - name: Verify inherited research provenance
        run: python scripts/verify_provenance.py
