name: Coherent infinite arithmetic EPR code tower

on:
  push:
    branches:
      - research/prime-bridge-coherent-tower-2026-10-22
    paths:
      - 'observational_succ/coherent_prime_tower.py'
      - 'tests/test_coherent_prime_tower.py'
      - 'scripts/coherent_prime_tower_probe.py'
      - 'research/2026-10-22/PRIME_BRIDGE_COHERENT_INFINITE_TOWER.md'
      - 'research/2026-10-22/PRIME_BRIDGE_COHERENT_TOWER_RECEIPT.json'
      - '.github/workflows/coherent-prime-tower.yml'
  pull_request:
    paths:
      - 'observational_succ/coherent_prime_tower.py'
      - 'tests/test_coherent_prime_tower.py'
      - 'scripts/coherent_prime_tower_probe.py'
      - 'research/2026-10-22/PRIME_BRIDGE_COHERENT_INFINITE_TOWER.md'
      - 'research/2026-10-22/PRIME_BRIDGE_COHERENT_TOWER_RECEIPT.json'
      - '.github/workflows/coherent-prime-tower.yml'

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify inherited arithmetic EPR star
        run: python -Werror -m unittest discover -s tests -p 'test_arithmetic_epr_star.py' -v
      - name: Verify exact infinite-tower finite oracles
        run: python -Werror -m unittest discover -s tests -p 'test_coherent_prime_tower.py' -v
      - name: Replay deterministic exact receipt and source hashes
        run: |
          PYTHONPATH=. python scripts/coherent_prime_tower_probe.py > "$RUNNER_TEMP/coherent-prime-tower.json"
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path.cwd()
          actual=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'coherent-prime-tower.json').read_text())
          expected=json.loads((root/'research/2026-10-22/PRIME_BRIDGE_COHERENT_TOWER_RECEIPT.json').read_text())
          assert actual==expected,'Replayed source-exact finite receipt differs from frozen artifact'
          assert actual['RH_proved'] is False and actual['geometric_gravitational_duality_claimed'] is False
          assert actual['affine_monoid_exhaustive_parameter_cases']==432
          assert actual['two_ray_mirror_exact_region_pair_checks']==108
          for key,path in (
              ('tower_module_sha256','observational_succ/coherent_prime_tower.py'),
              ('tower_tests_sha256','tests/test_coherent_prime_tower.py'),
              ):
              assert actual[key]==hashlib.sha256((root/path).read_bytes()).hexdigest()
          PY
