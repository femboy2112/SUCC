name: Connes source-typed oriented local trace

on:
  push:
    branches:
      - 'research/connes-oriented-local-trace-*'
  pull_request:
    paths:
      - 'observational_succ/connes_oriented_scaling.py'
      - 'tests/test_connes_oriented_scaling.py'
      - 'observational_succ/multiplicative_orientation_gram.py'
      - 'tests/test_multiplicative_orientation_gram.py'
      - 'research/2026-10-18/MULTIPLICATIVE_ORIENTATION_GRAM.md'
      - 'docs/CLAIM_SUPPLEMENT_MULTIPLICATIVE_ORIENTATION_GRAM.md'
      - 'research/2026-10-18/CONNES_ORIENTED_LOCAL_TRACE_BRIDGE.md'
      - 'docs/CLAIM_SUPPLEMENT_CONNES_ORIENTED_SCALING.md'
      - '.github/workflows/connes-oriented-local-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-connes-local:
    name: Source-typed local Connes checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package
        run: python -m pip install -e .
      - name: Compile exact bridge and independent source probes
        run: |
          python -m compileall -q observational_succ/connes_oriented_scaling.py
          python -m compileall -q tests/test_connes_oriented_scaling.py
          python -m compileall -q observational_succ/multiplicative_orientation_gram.py
          python -m compileall -q tests/test_multiplicative_orientation_gram.py
      - name: Finite analytic and hostile orientation controls
        run: python -m unittest discover -s tests -p 'test_connes_oriented_scaling.py' -v
      - name: Exact arithmetic and archimedean Gram, valuation and cross-oracle checks
        run: python -m unittest discover -s tests -p 'test_multiplicative_orientation_gram.py' -v
      - name: Verify historical provenance manifests
        run: python scripts/verify_provenance.py
