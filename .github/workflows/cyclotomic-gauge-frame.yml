name: Cyclotomic SUCC gauge frames and signed BBP source

on:
  push:
    branches:
      - research/cyclotomic-gauge-frame-pi-2026-10-24
  pull_request:
    paths:
      - 'observational_succ/cyclotomic_gauge_frames.py'
      - 'tests/test_cyclotomic_gauge_frames.py'
      - 'research/2026-10-24/CYCLOFRAME_GAUGE_CYCLOTOMIC_PI.md'
      - 'scripts/cyclotomic_gauge_frames_probe.py'
      - '.github/workflows/cyclotomic-gauge-frame.yml'

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared repository requirements
        run: python -m pip install -e '.[test]'
      - name: Check source syntax and exact cyclotomic frame tests
        run: |
          python -Werror -m py_compile observational_succ/cyclotomic_gauge_frames.py tests/test_cyclotomic_gauge_frames.py scripts/cyclotomic_gauge_frames_probe.py
          python -m unittest discover -s tests -p 'test_cyclotomic_gauge_frames.py' -v
          python scripts/cyclotomic_gauge_frames_probe.py
      - name: Preserve certified parent BBP source transport
        run: python -m unittest discover -s tests -p 'test_pi_source_genesis.py' -v
      - name: Provenance and foundational SUCC control
        run: |
          python scripts/verify_provenance.py
          python scripts/observer_foundations_probe.py
