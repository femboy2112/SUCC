name: Cyclotomic selected source and signed interference
on:
  pull_request:
    paths:
      - 'observational_succ/cyclotomic_selected_source.py'
      - 'tests/test_cyclotomic_selected_source.py'
      - 'scripts/cyclotomic_selected_oracle.py'
      - 'scripts/cyclotomic_fiber_moment_oracle.py'
      - 'research/2026-10-24/CYCLOTOMIC_SELECTED*'
      - 'research/2026-10-24/CYCLOTOMIC_SELECTION*'
      - '.github/workflows/cyclotomic-selected-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - name: Exact source, signed twists, and hostile controls
        run: |
          python -Werror -m py_compile observational_succ/cyclotomic_selected_source.py scripts/cyclotomic_selected_oracle.py scripts/cyclotomic_fiber_moment_oracle.py
          python -m unittest discover -s tests -p 'test_cyclotomic_selected_source.py' -v
          python -m unittest discover -s tests -p 'test_circle_origin_gauge.py' -v
          python scripts/cyclotomic_selected_oracle.py --output /tmp/cyclotomic-selected.json
          cmp /tmp/cyclotomic-selected.json research/2026-10-24/CYCLOTOMIC_SELECTED_FINITE.json
          python scripts/verify_provenance.py
