name: Direct quotient and Pontryagin transfer research

on:
  push:
    branches:
      - research/direct-quotient-pontryagin-transfer-2026-10-17
    paths:
      - "observational_succ/affine_pontryagin_transfer.py"
      - "observational_succ/direct_quotient_schur.py"
      - "observational_succ/source_direct_quotient_gate.py"
      - "tests/test_affine_pontryagin_transfer.py"
      - "tests/test_direct_quotient_schur.py"
      - "tests/test_direct_quotient_hidden_residual.py"
      - "tests/test_source_direct_quotient_gate.py"
      - "scripts/direct_quotient_transfer_probe.py"
      - ".github/workflows/direct-quotient-transfer.yml"
  pull_request:
    paths:
      - "observational_succ/affine_pontryagin_transfer.py"
      - "observational_succ/direct_quotient_schur.py"
      - "observational_succ/source_direct_quotient_gate.py"
      - "tests/test_affine_pontryagin_transfer.py"
      - "tests/test_direct_quotient_schur.py"
      - "tests/test_direct_quotient_hidden_residual.py"
      - "tests/test_source_direct_quotient_gate.py"
      - "scripts/direct_quotient_transfer_probe.py"
      - ".github/workflows/direct-quotient-transfer.yml"

jobs:
  source-and-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify original source provenance
        run: python scripts/verify_provenance.py
      - name: Exact mathematical and authentic-source unit tests
        run: |
          python -m unittest discover -s tests -p 'test_affine_pontryagin_transfer.py'
          python -m unittest discover -s tests -p 'test_direct_quotient_schur.py'
          python -m unittest discover -s tests -p 'test_direct_quotient_hidden_residual.py'
          python -m unittest discover -s tests -p 'test_source_direct_quotient_gate.py'
      - name: Reproduce direct-quotient plus transfer receipt
        run: python scripts/direct_quotient_transfer_probe.py
