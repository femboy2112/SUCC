name: Edge carrier reconstruction exact theorem controls

on:
  push:
    branches:
      - 'research/edge-carrier-reconstruction-*'
  pull_request:
    paths:
      - 'observational_succ/edge_carrier_reconstruction.py'
      - 'observational_succ/finite_adele_localization.py'
      - 'observational_succ/complex_cauchy_edge.py'
      - 'tests/test_edge_carrier_*.py'
      - 'tests/test_finite_adele_localization.py'
      - 'tests/test_complex_cauchy_edge.py'
      - 'scripts/edge_carrier_reconstruction_probe.py'
      - '.github/workflows/edge-carrier-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-gates:
    name: Exact edge/space constructions (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source package without optional research dependencies
        run: python -m pip install -e .
      - name: Compile all new artifacts
        run: |
          python -m compileall -q observational_succ/edge_carrier_reconstruction.py observational_succ/finite_adele_localization.py observational_succ/complex_cauchy_edge.py
          python -m compileall -q tests/test_edge_carrier_reconstruction.py tests/test_finite_adele_localization.py tests/test_complex_cauchy_edge.py tests/test_edge_carrier_integration.py
      - name: Exact group/ring/metric/topological proxy controls
        run: |
          python -m unittest discover -s tests -p 'test_edge_carrier_reconstruction.py' -v
          python -m unittest discover -s tests -p 'test_finite_adele_localization.py' -v
          python -m unittest discover -s tests -p 'test_complex_cauchy_edge.py' -v
          python -m unittest discover -s tests -p 'test_edge_carrier_integration.py' -v
      - name: Preserve original source and execute proof gates
        run: |
          python scripts/verify_provenance.py
          python scripts/edge_carrier_reconstruction_probe.py > "$RUNNER_TEMP/edge-carrier.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"edge-carrier.json").read_text())
          assert d["RH_proved"] is False
          assert d["source_derived_complete_Weil_positivity"] is False
          assert d["all_points_of_C_A_Zhat_executed"] is False
          assert d["checks"]["finite_modular_edges_to_Zhat"]["e2_12"] == 9
          assert d["checks"]["finite_modular_edges_to_Zhat"]["CRT_partition_at_60"]["sum_modulus"] == 1
          assert d["checks"]["Zhat_to_Af_then_real_place"]["finite_adele_not_field"]["finite_adeles_are_a_field"] is False
          PY
