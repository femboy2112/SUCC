name: Exterior determinant kernel research

on:
  push:
    branches: ['astra-cloud/viii-exterior-kernel-*']
    paths: ['formal/exterior_rigidity/**', '.github/workflows/exterior-rigidity.yml']
  pull_request:
    paths: ['formal/exterior_rigidity/**', '.github/workflows/exterior-rigidity.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: succ-pinned-formal-kernel
  cancel-in-progress: false
jobs:
  exterior_kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install hash-verified pinned Lean
        run: |
          set -euo pipefail
          curl --fail -L https://github.com/leanprover/lean4/releases/download/v4.14.0/lean-4.14.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "320f18e7d58271d95fced740522b5a5ed41b85b2af5bf0e8ab9a8dbc380e450a  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --no-same-owner --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.14.0-linux/bin" >> "$GITHUB_PATH"
      - name: Fetch targeted pinned cache
        working-directory: formal/exterior_rigidity
        run: lake exe cache get Mathlib/LinearAlgebra/Matrix/Determinant/Basic.lean Mathlib/Algebra/GCDMonoid/Finset.lean Mathlib/Algebra/GCDMonoid/Nat.lean Mathlib/Data/Int/GCD.lean Mathlib/Tactic/NormNum.lean Mathlib/Tactic/Ring.lean
      - name: Build, export exact types and reject false mutations
        run: python3 formal/exterior_rigidity/check.py "$RUNNER_TEMP/succ-exterior-audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: succ-exterior-kernel-observation
          path: ${{ runner.temp }}/succ-exterior-audit/
