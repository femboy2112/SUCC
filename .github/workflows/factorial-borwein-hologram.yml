name: Factorial Borwein hologram exact proof-access checks

on:
  push:
    branches:
      - 'research/factorial-borwein-holographic-clock-*'
  pull_request:
    paths:
      - 'observational_succ/factorial_borwein_hologram.py'
      - 'tests/test_factorial_borwein_hologram.py'
      - 'scripts/factorial_borwein_hologram_probe.py'
      - '.github/workflows/factorial-borwein-hologram.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-factorial-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile authenticated kernels and test oracles
        run: |
          python -m py_compile observational_succ/factorial_borwein_hologram.py tests/test_factorial_borwein_hologram.py scripts/factorial_borwein_hologram_probe.py
          python -m unittest discover -s tests -p 'test_borwein_prime_clock.py' -v
          python -m unittest discover -s tests -p 'test_factorial_borwein_hologram.py' -v
          python -m scripts.factorial_borwein_hologram_probe > /tmp/factorial_borwein_receipt.json
          python -m json.tool /tmp/factorial_borwein_receipt.json >/dev/null
