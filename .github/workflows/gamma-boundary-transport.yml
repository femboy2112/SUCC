name: Gamma transport form and rank-four boundary proof
on:
  push:
    branches: ['research/gamma-boundary-form-covariance-*']
  pull_request:
    paths:
      - 'observational_succ/transported_gamma_boundary.py'
      - 'tests/test_transported_gamma_boundary.py'
      - 'scripts/transported_gamma_boundary_probe.py'
      - 'formal/GammaBoundaryShapeTransport.lean'
      - '.github/workflows/gamma-boundary-transport.yml'
permissions:
  contents: read
jobs:
  original-source-and-rational:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual pinned research source
        run: python -m pip install -e '.[test]'
      - name: Verify original signed Suzuki source
        run: python scripts/verify_provenance.py
      - name: Independent rational commutator/exterior/parity tests
        run: python -m unittest discover -s tests -p 'test_transported_gamma_boundary.py' -v
      - name: Replay exact controls and ORIGINAL source contract
        run: |
          PYTHONPATH=. python scripts/transported_gamma_boundary_probe.py --verify
          PYTHONPATH=. python scripts/transported_gamma_boundary_probe.py --source --verify
      - name: Preserve genuine Gamma packet parent tests
        run: python -m unittest discover -s tests -p 'test_gamma_packet_certificates.py' -q
  lean-shape-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned standalone Lean compiler
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
      - name: Kernel-check transported shape and value counterexample
        run: |
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lean" formal/GammaBoundaryShapeTransport.lean
      - name: Reject unsupported proof bypasses
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          code=Path("formal/GammaBoundaryShapeTransport.lean").read_text().split("namespace ObservationalSUCC.GammaBoundaryShapeTransport",1)[1]
          assert re.search(r'\b(sorry|admit|axiom|unsafe|native_decide)\b',code) is None
          PY
