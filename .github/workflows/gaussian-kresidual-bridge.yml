name: Gaussian two-SUCC and clamped K-residual source validation
on:
  push:
    branches:
      - 'research/gaussian-halfdensity-kresidual-*'
  pull_request:
    paths:
      - 'observational_succ/clamped_k_residual_bridge.py'
      - 'observational_succ/gaussian_prime_two_density.py'
      - 'observational_succ/gaussian_euler_shell_controls.py'
      - 'tests/test_clamped_k_residual_bridge.py'
      - 'tests/test_gaussian_prime_two_density.py'
      - 'tests/test_gaussian_euler_shell_controls.py'
      - 'formal/GaussianTwoSuccessor.lean'
      - '.github/workflows/gaussian-kresidual-bridge.yml'
permissions:
  contents: read
jobs:
  source-exact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the frozen-source research package
        run: python -m pip install -e '.[test]'
      - name: Preserve original source provenance
        run: python scripts/verify_provenance.py
      - name: Exact H2 clamped K-relative Schwarz tests
        run: python -m unittest discover -s tests -p 'test_clamped_k_residual_bridge.py' -v
      - name: Genuine Gaussian index-two and half-density controls
        run: python -m unittest discover -s tests -p 'test_gaussian_prime_two_density.py' -v
      - name: Ramified p2 split p5 inert p3 Euler tower controls
        run: python -m unittest discover -s tests -p 'test_gaussian_euler_shell_controls.py' -v
      - name: Original-source signed low-high and Euler receipt
        run: |
          PYTHONPATH=. python scripts/gaussian_kresidual_probe.py --verify
          PYTHONPATH=. python scripts/gaussian_kresidual_probe.py --source --verify
      - name: Preserve parent original infinite Gamma and boundary tests
        run: |
          python -m unittest discover -s tests -p 'test_infinite_gamma_carleman.py' -q
          python -m unittest discover -s tests -p 'test_transported_gamma_boundary.py' -q
  lean-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Lean 4
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
      - name: Kernel-check integer two-step and Gaussian rotation
        run: |
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lean" formal/GaussianTwoSuccessor.lean
