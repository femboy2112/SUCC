name: Gaussian two-SUCC and authentic clamped K-residual bridge
on:
  push:
    branches: ['research/gaussian-halfdensity-kresidual-*']
  pull_request:
    paths:
      - 'observational_succ/clamped_k_residual_bridge.py'
      - 'observational_succ/gaussian_prime_two_density.py'
      - 'tests/test_clamped_k_residual_bridge.py'
      - 'tests/test_gaussian_prime_two_density.py'
      - 'formal/GaussianTwoSuccessor.lean'
      - '.github/workflows/gaussian-kresidual-bridge.yml'
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - name: Frozen original source provenance
        run: python scripts/verify_provenance.py
      - name: Exact source-true K-Schur/half-density + negative controls, no skips
        run: |
          python -m unittest discover -s tests -p 'test_clamped_k_residual_bridge.py' -v > "$RUNNER_TEMP/kresidual.txt" 2>&1 || { cat "$RUNNER_TEMP/kresidual.txt"; exit 1; }
          cat "$RUNNER_TEMP/kresidual.txt"
          grep -q '^OK$' "$RUNNER_TEMP/kresidual.txt"
          if grep -Eq 'skipped=[1-9]|FAILED \(|ERROR:' "$RUNNER_TEMP/kresidual.txt"; then exit 1; fi
          python -m unittest discover -s tests -p 'test_gaussian_prime_two_density.py' -v > "$RUNNER_TEMP/gaussian.txt" 2>&1 || { cat "$RUNNER_TEMP/gaussian.txt"; exit 1; }
          cat "$RUNNER_TEMP/gaussian.txt"
          grep -q '^OK$' "$RUNNER_TEMP/gaussian.txt"
          if grep -Eq 'skipped=[1-9]|FAILED \(|ERROR:' "$RUNNER_TEMP/gaussian.txt"; then exit 1; fi
      - name: Recheck parent source-complete infinite Gamma and parity
        run: |
          python -m unittest discover -s tests -p 'test_infinite_gamma_carleman.py' -q
          python -m unittest discover -s tests -p 'test_transported_gamma_boundary.py' -q
  lean-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Lean compiler
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
      - name: Kernel-check successor/Gaussian two-step without bypass
        run: |
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lean" formal/GaussianTwoSuccessor.lean
          python - <<'PY'
          import re
          from pathlib import Path
          code=Path("formal/GaussianTwoSuccessor.lean").read_text().split("namespace ObservationalSUCC.GaussianTwoSuccessor",1)[1]
          assert re.search(r'\b(sorry|admit|axiom|unsafe|native_decide)\b',code) is None
          PY
