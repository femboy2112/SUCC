name: Gaussian SUCC source observer and signed Weil certificate frontier

on:
  push:
    branches:
      - 'research/gaussian-weil-conditional-certificates-*'
  pull_request:
    paths:
      - 'observational_succ/gaussian_weil_certificates.py'
      - 'tests/test_gaussian_weil_certificates.py'
      - 'scripts/gaussian_weil_certificates_probe.py'
      - 'research/2026-10-14/*GAUSSIAN_WEIL*'
      - '.github/workflows/gaussian-weil-certificates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_gaussian_and_signed_source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install research extras
        run: python -m pip install -e '.[test]'
      - name: Exact Gaussian and signed source mutation controls
        run: python -m unittest discover -s tests -p 'test_gaussian_weil_certificates.py' -v
      - name: Zero-independent rational receipt replay
        run: python scripts/gaussian_weil_certificates_probe.py --verify research/2026-10-14/GAUSSIAN_WEIL_EXACT_RECEIPT.json
      - name: Frozen source provenance
        run: python scripts/verify_provenance.py
