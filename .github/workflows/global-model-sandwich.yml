name: Global model sandwich finite certificates
on:
  push:
    branches:
      - 'research/global-model-sandwich-*'
  pull_request:
    paths:
      - 'observational_succ/global_model_sandwich.py'
      - 'tests/test_global_model_sandwich.py'
      - 'scripts/global_model_sandwich_probe.py'
      - 'research/2026-10-14/GLOBAL_MODEL_SANDWICH*'
      - 'docs/CLAIM_SUPPLEMENT_GLOBAL_MODEL_SANDWICH.md'
      - '.github/workflows/global-model-sandwich.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_models:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install source package
        run: python -m pip install -e '.[test]'
      - name: Source-indexed categorical and algebraic exact tests
        run: python -m unittest discover -s tests -p 'test_global_model_sandwich.py' -v
      - name: Exact scientific receipt replay
        run: python scripts/global_model_sandwich_probe.py --verify research/2026-10-14/GLOBAL_MODEL_SANDWICH_RECEIPT.json
      - name: Preserve original SUCC source and archives
        run: python scripts/verify_provenance.py
