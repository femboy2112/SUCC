name: Hilbert SUCC source-typed finite-to-global and Weil strata

on:
  push:
    branches:
      - 'research/hilbert-*'
  pull_request:
    paths:
      - 'observational_succ/hilbert_succ.py'
      - 'tests/test_hilbert_succ.py'
      - 'scripts/hilbert_succ_probe.py'
      - 'research/2026-10-14/HILBERT_SUCC_SOURCE_RECEIPT.json'
      - '.github/workflows/hilbert-succ.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math:
    name: Hilbert exact source and original signed Weil (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tested integrated source package
        run: python -m pip install -e ".[test]"
      - name: Reject absent or drifted original signed Suzuki source
        run: |
          python - <<'PY'
          from observational_succ.hilbert_succ import _pinned_original_weil_source, PINNED_WEIL_BLOB
          s = _pinned_original_weil_source()
          assert s.assert_original_source_tape()
          assert PINNED_WEIL_BLOB == '0cc8510b71d178fc79e8d410a86d8b6014cf9178'
          print('ORIGINAL_SIGNED_WEIL_SOURCE_SHA_VERIFIED')
          PY
      - name: Exact Hilbert recursive, strata and original source tests
        run: python -m unittest discover -s tests -p 'test_hilbert_succ.py' -v
      - name: Exact original source Hilbert locality/Rayleigh probe
        run: python scripts/hilbert_succ_probe.py --source-probe
      - name: Replay the independent finite-source mathematical receipt
        run: python scripts/hilbert_succ_probe.py --verify research/2026-10-14/HILBERT_SUCC_SOURCE_RECEIPT.json
      - name: Verify original source manifest and compile
        run: |
          python scripts/verify_provenance.py
          python -m compileall -q observational_succ/hilbert_succ.py tests/test_hilbert_succ.py scripts/hilbert_succ_probe.py
