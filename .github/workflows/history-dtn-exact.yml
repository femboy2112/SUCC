name: HISTORY-DTN exact finite probes
on:
  pull_request:
    paths:
      - 'observational_succ/growing_dtn_history.py'
      - 'tests/test_growing_dtn_history.py'
      - 'scripts/growing_dtn_history_probe.py'
      - '.github/workflows/history-dtn-exact.yml'
  workflow_dispatch:

jobs:
  exact-growth:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact finite growing-network source and hostile tests
        run: |
          python -m unittest discover -s tests -p 'test_growing_dtn_history.py' -v
          python scripts/growing_dtn_history_probe.py
      - name: Historical provenance gate
        run: python scripts/verify_provenance.py
