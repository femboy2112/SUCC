name: Lonely Runner referee exact census and source geometry

on:
  pull_request:
    paths:
      - 'observational_succ/lonely_runner_referee*.py'
      - 'scripts/*lonely_runner*referee*.py'
      - 'scripts/lonely_runner_endpoint*.py'
      - 'scripts/check_lonely_runner_growth_lean.py'
      - 'tests/test_lonely_runner_*.py'
      - 'formal/LonelyRunner*.lean'
      - 'research/2026-10-28/lonely_runner/referee/**'
      - 'formal/mathlib_bridge/lake-manifest.json'
      - 'formal/kernel_audit/ExportCommand.lean'
      - 'scripts/cambrian_audit_c_lean.py'
      - 'lean-toolchain'
      - '.github/workflows/lonely-referee.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lonely-referee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python scripts/check_lonely_runner_referee.py --output "$RUNNER_TEMP/referee-exact"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lonely-referee-exact-${{ matrix.python }}
          path: ${{ runner.temp }}/referee-exact/

  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install hash-verified Lean 4.14
        run: |
          set -euo pipefail
          curl --fail -L https://github.com/leanprover/lean4/releases/download/v4.14.0/lean-4.14.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "320f18e7d58271d95fced740522b5a5ed41b85b2af5bf0e8ab9a8dbc380e450a  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --no-same-owner --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.14.0-linux/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned source geometry dependencies
        working-directory: formal/mathlib_bridge
        run: lake exe cache get Mathlib/Data/Real/Archimedean.lean Mathlib/Data/Finset/Max.lean Mathlib/Data/Int/Interval.lean Mathlib/Data/Rat/Cast/Order.lean Mathlib/Tactic/Linarith.lean Mathlib/Tactic/Ring.lean Mathlib/Tactic/NormNum.lean Mathlib/Tactic/FieldSimp.lean Mathlib/Tactic/Positivity.lean
      - name: Compile actual source theorem and reject false controls
        run: python scripts/check_lonely_runner_growth_lean.py --output "$RUNNER_TEMP/referee-kernel"
      - run: python scripts/build_math_memory.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lonely-referee-kernel
          path: ${{ runner.temp }}/referee-kernel/
