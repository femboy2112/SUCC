name: Lonely Runner exact certificates and kernel proofs

on:
  push:
    branches: ['research/succ-lonely-runner-*']
  pull_request:
    paths:
      - 'observational_succ/lonely_runner_*.py'
      - 'tests/test_lonely_runner_*.py'
      - 'scripts/*lonely_runner*.py'
      - 'formal/LonelyRunner*.lean'
      - 'research/2026-10-28/lonely_runner/**'
      - 'docs/CLAIM_SUPPLEMENT_LONELY_RUNNER.md'
      - 'lean-toolchain'
      - 'formal/mathlib_bridge/lake-manifest.json'
      - 'formal/kernel_audit/ExportCommand.lean'
      - 'scripts/cambrian_audit_c_lean.py'
      - 'scripts/build_math_memory.py'
      - 'tests/test_math_memory.py'
      - '.github/workflows/lonely-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lonely-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Exact source and hostile replay (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - name: Provenance, native probes, exact source and independent oracles
        run: python scripts/check_lonely_runner_source.py --output "$RUNNER_TEMP/lonely-runner-source"
      - name: Verify regenerated mathematical discovery catalog
        run: python scripts/build_math_memory.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lonely-runner-source-${{ matrix.python }}
          path: ${{ runner.temp }}/lonely-runner-source/

  lean:
    name: Lean universal witness and cover soundness with negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install hash-verified Lean 4.14.0
        run: |
          set -euo pipefail
          curl --fail -L https://github.com/leanprover/lean4/releases/download/v4.14.0/lean-4.14.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "320f18e7d58271d95fced740522b5a5ed41b85b2af5bf0e8ab9a8dbc380e450a  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --no-same-owner --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.14.0-linux/bin" >> "$GITHUB_PATH"
      - name: Retrieve only pinned dependencies needed by the campaign proofs
        working-directory: formal/mathlib_bridge
        run: lake exe cache get Mathlib/Data/Real/Basic.lean Mathlib/Tactic/Linarith.lean Mathlib/Tactic/Ring.lean Mathlib/Tactic/NormNum.lean Mathlib/Tactic/FieldSimp.lean Mathlib/Tactic/Positivity.lean
      - name: Serial kernel checks, proposition and axiom exports, false controls
        run: python scripts/check_lonely_runner_lean.py --output "$RUNNER_TEMP/lonely-runner-lean"
      - name: Downloaded Lean cache must not change the research catalog
        run: python scripts/build_math_memory.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lonely-runner-lean
          path: ${{ runner.temp }}/lonely-runner-lean/
