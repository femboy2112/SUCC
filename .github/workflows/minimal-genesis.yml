name: Minimal Genesis — sharp first carry and BBP Green source fidelity
on:
  push:
    branches:
      - research/minimal-genesis-first-carry-2026-10-24
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install source and tests
        run: python -m pip install -e '.[test]'
      - name: Compile exact new modules and independent regressions
        run: |
          python -Werror -m py_compile observational_succ/minimal_circle_carry.py observational_succ/minimal_green_obstruction.py observational_succ/minimal_moment_clock.py tests/test_minimal_circle_carry.py tests/test_minimal_moment_clock.py scripts/minimal_genesis_probe.py
          python -m unittest discover -s tests -p 'test_minimal*.py' -v
      - name: Frozen rational receipt and original source provenance
        run: |
          python scripts/minimal_genesis_probe.py --check
          python scripts/verify_provenance.py
          python scripts/observer_foundations_probe.py
          python scripts/ordinal_succ_report_probe.py
