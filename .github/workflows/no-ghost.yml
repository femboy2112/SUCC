name: NO-GHOST exact causal certificates and Lean kernel

on:
  push:
    branches: ['research/no-ghost-*']
  pull_request:
    paths:
      - 'observational_succ/no_ghost*.py'
      - 'tests/test_no_ghost*.py'
      - 'formal/NoGhost.lean'
      - 'scripts/*no_ghost*'
      - 'research/2026-10-13/NO_GHOST/**'
      - '.github/workflows/no-ghost.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact adversarial tests and receipt replay
        run: |
          python -m unittest discover -s tests -p 'test_no_ghost*.py' -v
          python scripts/no_ghost_probe.py --output /tmp/no_ghost_exact_receipt.json
          cmp /tmp/no_ghost_exact_receipt.json research/2026-10-13/NO_GHOST/examples/no_ghost_exact_receipt.json
  lean_kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official pinned Lean4.14
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel, exact axiom sets, and negative compiler control
        run: bash scripts/verify_no_ghost_lean.sh
