name: Oily branch coercivity pinned finite Lean

on:
  pull_request:
    paths:
      - 'formal/OilyBranchCoercivity.lean'
      - 'scripts/check_oily_branch_coercivity_lean.py'
      - '.github/workflows/oily-branch-coercivity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oily-branch-coercivity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finite_kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install hash-verified pinned Lean archive
        run: |
          set -euo pipefail
          curl --fail -L https://github.com/leanprover/lean4/releases/download/v4.14.0/lean-4.14.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "320f18e7d58271d95fced740522b5a5ed41b85b2af5bf0e8ab9a8dbc380e450a  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --no-same-owner --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.14.0-linux/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependencies and targeted cache
        working-directory: formal/mathlib_bridge
        run: |
          lake exe cache get Mathlib/Data/Real/Basic.lean Mathlib/Tactic/Linarith.lean Mathlib/Tactic/NormNum.lean Mathlib/Tactic/Ring.lean
      - name: Compile, export exact theorem types and axioms, reject mutants
        run: |
          python scripts/check_oily_branch_coercivity_lean.py --output "$RUNNER_TEMP/oily-branch-coercivity"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oily-branch-coercivity-clean-kernel
          path: ${{ runner.temp }}/oily-branch-coercivity/
