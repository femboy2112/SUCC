name: ONE OBJECT true-source Neumann contact and zero-shift residual

on:
  push:
    branches:
      - 'research/one-object-residual-schur-*'
  pull_request:
    paths:
      - 'observational_succ/one_object_relative_residual.py'
      - 'observational_succ/one_object_source_residual.py'
      - 'observational_succ/one_object_contact_neumann.py'
      - 'tests/test_one_object_relative_residual.py'
      - 'tests/test_one_object_source_residual.py'
      - 'tests/test_one_object_contact_neumann.py'
      - 'scripts/one_object_residual_probe.py'
      - 'research/2026-10-15/ONE_OBJECT_RESIDUAL_*'
      - '.github/workflows/one-object-relative-schur.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_relative_zero_shift:
    name: genuine source high range and exact finite relative Schur (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - name: Syntax and exact source modules
        run: python -m compileall -q observational_succ/one_object_relative_residual.py observational_succ/one_object_source_residual.py observational_succ/one_object_contact_neumann.py tests/test_one_object_relative_residual.py tests/test_one_object_source_residual.py tests/test_one_object_contact_neumann.py scripts/one_object_residual_probe.py
      - name: Original high-sector source/Neumann zero-shift regressions
        run: |
          python -m unittest discover -s tests -p 'test_hilbert_weil_atlas.py' -v
          python -m unittest discover -s tests -p 'test_suzuki_moment_schur.py' -v
          python -m unittest discover -s tests -p 'test_source_weil_hierarchy.py' -v
      - name: Conditional real contact and residual proof tests
        run: |
          python -m unittest discover -s tests -p 'test_one_object_relative_residual.py' -v
          python -m unittest discover -s tests -p 'test_one_object_source_residual.py' -v
          python -m unittest discover -s tests -p 'test_one_object_contact_neumann.py' -v
      - name: Frozen source and sign-debt receipt
        run: python scripts/one_object_residual_probe.py --verify research/2026-10-15/ONE_OBJECT_RESIDUAL_RECEIPT.json
      - name: Original immutable SUCC provenance
        run: python scripts/verify_provenance.py
