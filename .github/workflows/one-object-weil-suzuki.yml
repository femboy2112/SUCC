name: One object Weil-Suzuki / Connes source gate

on:
  push:
    branches:
      - 'research/one-object-tate-weil-suzuki-connes-*'
  pull_request:
    paths:
      - 'observational_succ/one_object_transport.py'
      - 'tests/test_one_object_transport.py'
      - 'tests/test_one_object_kernel_certificates.py'
      - 'observational_succ/one_object_kernel_certificates.py'
      - 'scripts/one_object_transport_probe.py'
      - '.github/workflows/one-object-weil-suzuki.yml'

jobs:
  exact-one-object:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Source / finite Connes / Weil-Suzuki exact and numeric controls
        run: python -m unittest discover -s tests -p 'test_one_object*.py' -v
      - name: Deterministic arithmetic and source receipt
        run: python scripts/one_object_transport_probe.py
      - name: Imported-source provenance verification
        run: python scripts/verify_provenance.py
