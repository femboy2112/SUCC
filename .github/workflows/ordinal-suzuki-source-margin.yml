name: ORDINAL authentic Suzuki signed interval-margin certification

on:
  push:
    branches:
      - 'research/ordinal-authentic-suzuki-margin-*'
  pull_request:
    paths:
      - 'observational_succ/ordinal_suzuki_source_margins.py'
      - 'tests/test_ordinal_suzuki_source_margins.py'
      - 'scripts/ordinal_suzuki_source_margin_probe.py'
      - '.github/workflows/ordinal-suzuki-source-margin.yml'

jobs:
  source-interval-ordinal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source proof and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Original signed source ordinal margin tests
        run: python -m unittest discover -s tests -p 'test_ordinal_suzuki_source_margins.py' -v
      - name: Original source sign / finite Schur source regression
        run: python -m unittest discover -s tests -p 'test_observer_global_sign_gate.py' -v
      - name: Ordinal-ranked SUCC true finite path regressions
        run: python -m unittest discover -s tests -p 'test_ordinal_ranked_succ.py' -v
      - name: Exact original source deterministic signed margin receipt
        run: python scripts/ordinal_suzuki_source_margin_probe.py
      - name: Original source blob immutable provenance
        run: python scripts/verify_provenance.py
