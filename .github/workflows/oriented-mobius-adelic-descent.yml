name: Oriented Mobius and adelic descent

on:
  push:
    branches:
      - 'research/oriented-mobius-adelic-descent-*'
  pull_request:
    paths:
      - 'observational_succ/oriented_mobius_adelic.py'
      - 'observational_succ/radial_projective_trace_bridge.py'
      - 'observational_succ/full_prime_tower_transport.py'
      - 'tests/test_oriented_mobius_adelic.py'
      - 'tests/test_radial_projective_trace_bridge.py'
      - 'tests/test_full_prime_tower_transport.py'
      - 'research/2026-10-18/ORIENTED_COUNTING_TO_ADELIC_TRACE.md'
      - 'docs/CLAIM_SUPPLEMENT_ORIENTED_COUNTING_ADELIC.md'
      - '.github/workflows/oriented-mobius-adelic-descent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile mathematical sources and independent tests
        run: |
          python -m compileall -q observational_succ/oriented_mobius_adelic.py
          python -m compileall -q observational_succ/radial_projective_trace_bridge.py
          python -m compileall -q observational_succ/full_prime_tower_transport.py
          python -m compileall -q tests/test_oriented_mobius_adelic.py
          python -m compileall -q tests/test_radial_projective_trace_bridge.py
          python -m compileall -q tests/test_full_prime_tower_transport.py
      - name: Signed counting Boolean versus p-square exact controls
        run: python -m unittest discover -s tests -p 'test_oriented_mobius_adelic.py' -v
      - name: Radial projective all-jet and original Connes Tate crosschecks
        run: python -m unittest discover -s tests -p 'test_radial_projective_trace_bridge.py' -v
      - name: Full Tate p-power tower and projective conditioning probes
        run: python -m unittest discover -s tests -p 'test_full_prime_tower_transport.py' -v
      - name: Run source p-adic ball test
        run: python -m unittest discover -s tests -p 'test_connes_compact_open_test_bridge.py' -v
      - name: Verify frozen source provenance
        run: python scripts/verify_provenance.py
