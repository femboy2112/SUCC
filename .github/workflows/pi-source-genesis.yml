name: Pi source genesis exact signed transport
on:
  pull_request:
    paths:
      - 'observational_succ/pi_source_genesis.py'
      - 'tests/test_pi_source_genesis.py'
      - 'scripts/pi_source_genesis_oracle.py'
      - 'research/2026-10-24/PI_SOURCE_GENESIS*'
      - 'formal/duck_pi/BBPSourceGenesis.lean'
      - '.github/workflows/pi-source-genesis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - name: Source, signed phase and hostile contracts
        run: |
          python -Werror -m py_compile observational_succ/pi_source_genesis.py scripts/pi_source_genesis_oracle.py
          python -m unittest discover -s tests -p 'test_pi_source_genesis.py' -v
          python -m unittest discover -s tests -p 'test_bbp_source_memory.py' -v
          python scripts/pi_source_genesis_oracle.py --output /tmp/pi-source-genesis.json
          cmp /tmp/pi-source-genesis.json research/2026-10-24/PI_SOURCE_GENESIS_FINITE.json
          python scripts/verify_provenance.py
