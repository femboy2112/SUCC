name: Pontryagin finite-adèle source duality

on:
  push:
    branches:
      - 'research/pontryagin-finite-adelic-duality-*'
  pull_request:
    paths:
      - 'observational_succ/pontryagin_source_duality.py'
      - 'observational_succ/finite_adelic_character_bridge.py'
      - 'observational_succ/pontryagin_tate_atlas.py'
      - 'observational_succ/finite_cyclic_poisson.py'
      - 'tests/test_pontryagin_source_duality.py'
      - 'tests/test_finite_adelic_character_bridge.py'
      - 'tests/test_pontryagin_tate_atlas.py'
      - 'tests/test_finite_cyclic_poisson.py'
      - 'scripts/pontryagin_finite_adelic_probe.py'
      - '.github/workflows/pontryagin-finite-adeles.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pontryagin-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-dual:
    name: Exact Pontryagin/Tate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source package
        run: python -m pip install -e .
      - name: Compile source and independent test oracles
        run: |
          python -m compileall -q observational_succ/pontryagin_source_duality.py observational_succ/finite_adelic_character_bridge.py observational_succ/pontryagin_tate_atlas.py observational_succ/finite_cyclic_poisson.py
          python -m compileall -q tests/test_pontryagin_source_duality.py tests/test_finite_adelic_character_bridge.py tests/test_pontryagin_tate_atlas.py tests/test_finite_cyclic_poisson.py
      - name: Check cyclic source characters and naturality
        run: python -m unittest discover -s tests -p 'test_pontryagin_source_duality.py' -v
      - name: Check quotient, rational reciprocity and non-splitting
        run: python -m unittest discover -s tests -p 'test_finite_adelic_character_bridge.py' -v
      - name: Triangulate original Tate S-chart vs adele vs finite group
        run: python -m unittest discover -s tests -p 'test_pontryagin_tate_atlas.py' -v
      - name: Check finite source Poisson and sign mutants
        run: python -m unittest discover -s tests -p 'test_finite_cyclic_poisson.py' -v
      - name: Preserve provenance and execute independent source probe
        run: |
          python scripts/verify_provenance.py
          python scripts/pontryagin_finite_adelic_probe.py > "$RUNNER_TEMP/pontryagin.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"pontryagin.json").read_text())
          assert d["RH_proved"] is False
          assert d["adelic_Poisson_proved_here"] is False
          assert d["source_derived_Weil_PSD_proved"] is False
          assert d["tate_transport"]["opposite_signs_cancel"] is True
          assert d["tate_transport"]["original_S_atlas"]["three_way_compatibility"] is True
          assert d["finite_poisson"]["source_coset"]["finite_poisson_exact"] is True
          assert d["finite_adele_quotient"]["nonsplit"]["exact_sequence_splits_as_groups"] is False
          PY
