name: Portable prime sundial — exact source and kernel gate

on:
  push:
    branches:
      - 'research/portable-prime-sundial-*'
  pull_request:
    paths:
      - 'observational_succ/portable_prime_sundial.py'
      - 'tests/test_portable_prime_sundial.py'
      - 'scripts/portable_prime_sundial_probe.py'
      - 'research/2026-10-19/PORTABLE_SUNDIAL_FINITE_RECEIPT.json'
      - 'formal/PortablePrimeSundial.lean'
      - '.github/workflows/portable-prime-sundial.yml'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_source:
    name: Exact CRT/prime-birth sundial (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install source package
        run: python -m pip install -e .
      - name: Replay all portable sundial countermodels and exact prime-clock oracles
        run: python -m unittest discover -s tests -p 'test_portable_prime_sundial.py' -v
      - name: Freeze and verify the independent finite oracle receipt
        shell: bash
        run: |
          python -m scripts.portable_prime_sundial_probe > "$RUNNER_TEMP/portable.json"
          diff -u research/2026-10-19/PORTABLE_SUNDIAL_FINITE_RECEIPT.json "$RUNNER_TEMP/portable.json"
          python - "$RUNNER_TEMP/portable.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["status"]=="EXACT_FINITE_PORTABLE_SUNDIAL_SOURCE_CONTRACT"
          assert x["independent_frames_checked"]==256
          assert x["prime_power_clock_readings_checked"]==1024
          assert x["diagonal_prime_power_windows_nonempty"]==306
          assert x["prime_phase_wheel"]["wheel"]==120
          assert x["equal_initial_ratio_alias"]["first_next"]=="2/3"
          assert x["equal_initial_ratio_alias"]["second_next"]=="3/5"
          assert x["source_authenticated"] is False
          assert x["ABC_proved"] is False and x["RH_proved"] is False
          PY
      - name: Reverify original source/archive provenance
        run: python scripts/verify_provenance.py

  exact_lean:
    name: Standalone no-mathlib Lean 4 original-source cross-balance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean compiler
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check sundial cross-balance and frame morphisms
        shell: bash
        run: |
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lean" formal/PortablePrimeSundial.lean
          cp formal/PortablePrimeSundial.lean "$RUNNER_TEMP/SundialAxioms.lean"
          cat >> "$RUNNER_TEMP/SundialAxioms.lean" <<'LEAN'
          #print axioms ObservationalSUCC.PortablePrimeSundial.diagonal_cross_balance
          #print axioms ObservationalSUCC.PortablePrimeSundial.origin_shift
          #print axioms ObservationalSUCC.PortablePrimeSundial.homogeneous_cross_ratio
          #print axioms ObservationalSUCC.PortablePrimeSundial.quotient_does_not_determine_unit_succ
          LEAN
          "$HOME/.elan/bin/lean" "$RUNNER_TEMP/SundialAxioms.lean" > "$RUNNER_TEMP/axioms.log"
          cat "$RUNNER_TEMP/axioms.log"
          if grep -Fq 'Classical.choice' "$RUNNER_TEMP/axioms.log"; then
            echo "Constructive sundial proof unexpectedly depends on Classical.choice" >&2
            exit 1
          fi
      - name: Reject proof placeholders or new axioms in code
        shell: bash
        run: |
          python - <<'PY'
          import sys,re
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from cambrian_audit_c_lean import uncomment
          body=uncomment(Path('formal/PortablePrimeSundial.lean').read_text())
          assert not re.search(r'\b(sorry|admit|axiom|unsafe|native_decide)\b',body)
          print('SUNDIAL_NO_PLACEHOLDERS_OR_CUSTOM_AXIOMS')
          PY
