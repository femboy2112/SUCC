name: Prime Bridge exact arithmetic EPR star

on:
  push:
    branches:
      - research/prime-bridge-one-shot-2026-10-22
    paths:
      - 'observational_succ/arithmetic_epr_star.py'
      - 'tests/test_arithmetic_epr_star.py'
      - 'scripts/arithmetic_epr_star_probe.py'
      - 'research/2026-10-22/PRIME_BRIDGE_FINITE_RECEIPT.json'
      - '.github/workflows/prime-bridge-one-shot.yml'
  pull_request:
    paths:
      - 'observational_succ/arithmetic_epr_star.py'
      - 'tests/test_arithmetic_epr_star.py'
      - 'scripts/arithmetic_epr_star_probe.py'
      - 'research/2026-10-22/PRIME_BRIDGE_FINITE_RECEIPT.json'
      - '.github/workflows/prime-bridge-one-shot.yml'

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run source-hashed exact theorem and hostile checks
        run: python -Werror -m unittest discover -s tests -p test_arithmetic_epr_star.py -v
      - name: Verify deterministic recorded proof receipt
        run: |
          python scripts/arithmetic_epr_star_probe.py > "$RUNNER_TEMP/prime-bridge.json"
          python - <<'PY'
          import hashlib, json, pathlib, os
          root = pathlib.Path.cwd()
          evidence = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "prime-bridge.json").read_text())
          frozen = json.loads((root / "research/2026-10-22/PRIME_BRIDGE_FINITE_RECEIPT.json").read_text())
          assert evidence == frozen, "Exact receipt differs from checked-in result"
          assert evidence["RH_proved"] is False
          assert evidence["geometric_gravitational_duality_claimed"] is False
          assert all(c["mirror_equal"] and not c["mutated_source_mirror_equal"]
                     for c in evidence["all_nine_region_pair_checks"].values())
          assert evidence["source_module_sha256"] == hashlib.sha256(
              (root / "observational_succ/arithmetic_epr_star.py").read_bytes()).hexdigest()
          PY
