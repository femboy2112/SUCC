name: Secondary-circle prime/chord exact source and controls
on:
  push:
    branches:
      - research/secondary-circle-full-prime-defect-2026-10-23
    paths:
      - 'observational_succ/secondary_circle_rigidity.py'
      - 'tests/test_secondary_circle_rigidity.py'
      - 'scripts/secondary_circle_rigidity_probe.py'
      - 'scripts/secondary_circle_independent_oracle.py'
      - 'research/2026-10-23/SECONDARY_CIRCLE_*'
      - '.github/workflows/secondary-circle-rigidity.yml'
  pull_request:
    paths:
      - 'observational_succ/secondary_circle_rigidity.py'
      - 'tests/test_secondary_circle_rigidity.py'
      - 'scripts/secondary_circle_rigidity_probe.py'
      - 'scripts/secondary_circle_independent_oracle.py'
      - 'research/2026-10-23/SECONDARY_CIRCLE_*'
      - '.github/workflows/secondary-circle-rigidity.yml'
jobs:
  source-and-rigidity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install holdout evaluator
        run: python -m pip install 'mpmath>=1.3,<2'
      - name: Exact finite and hostile tests
        run: python -m unittest discover -s tests -p 'test_secondary_circle_rigidity.py' -v
      - name: Compile source and tests
        run: python -m compileall -q observational_succ/secondary_circle_rigidity.py tests/test_secondary_circle_rigidity.py scripts/secondary_circle_rigidity_probe.py scripts/secondary_circle_independent_oracle.py
      - name: Independent cyclotomic source oracle
        run: python scripts/secondary_circle_independent_oracle.py
      - name: Replay frozen exact rational receipt
        run: |
          python scripts/secondary_circle_rigidity_probe.py --output /tmp/secondary-circle-rigidity.json
          cmp /tmp/secondary-circle-rigidity.json research/2026-10-23/SECONDARY_CIRCLE_RIGIDITY_FINITE_RECEIPT.json
