name: Source-faithful carry exact sources and Lean

on:
  push:
    branches:
      - research/source-faithful-renormalization-carry-2026-10-23
  pull_request:
    paths:
      - '**/*source_faithful*'
      - 'formal/SourceFaithfulCarry.lean'
      - 'formal/kernel_audit/ExportCommand.lean'
      - 'research/2026-10-23/SOURCE_FAITHFUL*'
      - 'docs/CLAIM_SUPPLEMENT_SOURCE_FAITHFUL*'
      - '.github/workflows/source-faithful-carry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exact carry, observation and limit controls
        run: |
          python -Werror -m unittest discover -s tests -p 'test_source_faithful_*.py' -v
          python scripts/verify_provenance.py
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean through elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clean-host kernel, theorem expressions, axiom audit and false mutations
        run: python3 scripts/check_source_faithful_carry_lean.py --output /tmp/source-faithful-carry-clean-lean.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-faithful-carry-clean-lean
          path: /tmp/source-faithful-carry-clean-lean.json
