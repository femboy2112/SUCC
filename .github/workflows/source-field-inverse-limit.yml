name: Source field inverse-limit observability calculus

on:
  push:
    branches:
      - 'research/field-closure-inverse-limit-rh-*'
  pull_request:
    paths:
      - 'observational_succ/source_field_inverse_limits.py'
      - 'tests/test_source_field_inverse_limits.py'
      - 'observational_succ/source_field_gluing.py'
      - 'tests/test_source_field_gluing.py'
      - 'research/2026-10-15/SOURCE_FIELD_INVERSE_LIMIT_CALCULUS.md'
      - 'research/2026-10-15/SOURCE_FIELD_INVERSE_LIMIT_RECEIPT.json'
      - 'scripts/source_field_inverse_limit_probe.py'
      - '.github/workflows/source-field-inverse-limit.yml'

jobs:
  source-field-trilemma:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source mathematical test requirements
        run: python -m pip install -e ".[test]"
      - name: Run exact Simple/IdealHard/Fucked finite calibration and RH frontier guards
        run: python -m unittest discover -s tests -p 'test_source_field_inverse_limits.py' -v
      - name: Test recursive all-n source-positive gluing and singular phantom coupling
        run: python -m unittest discover -s tests -p 'test_source_field_gluing.py' -v
      - name: Check local Tate finite Fourier
        run: python -m unittest discover -s tests -p 'test_tate_finite_bruhat_observers.py' -v
      - name: Replay frozen source-indexed inverse-limit receipt
        run: python scripts/source_field_inverse_limit_probe.py --verify
      - name: Verify original Tate Suzuki high-sector source theorem
        run: python -m unittest discover -s tests -p 'test_tate_suzuki_fourier_schur.py' -v
      - name: Preserve mathematical all-radius positive high and sign-debt guards
        run: python -m unittest discover -s tests -p 'test_tate_suzuki_all_radii.py' -v
      - name: Preserve Zeno finite-to-global proof-debt regressions
        run: python -m unittest discover -s tests -p 'test_zeno_proof_debt.py' -v
      - name: Confirm immutable archived source provenance
        run: python scripts/verify_provenance.py
