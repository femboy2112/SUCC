name: Source-minimality clock carry renewal exact checks

on:
  push:
    branches:
      - 'research/source-minimality-*'
  pull_request:
    paths:
      - 'observational_succ/source_minimality.py'
      - 'observational_succ/carry_clock_lift.py'
      - 'observational_succ/renewal_rigidity.py'
      - 'tests/test_source_minimality.py'
      - 'scripts/source_minimality_probe.py'
      - 'research/2026-10-17/SOURCE_MINIMALITY_RECEIPT.json'
      - '.github/workflows/source-minimality.yml'

jobs:
  exact-stdlib:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_source_minimality.py' -v
      - run: python scripts/source_minimality_probe.py --verify
      - run: python -m unittest discover -s tests -p 'test_prime_jet_genesis.py' -v
      - run: python -m unittest discover -s tests -p 'test_profinite_index_genesis.py' -v
