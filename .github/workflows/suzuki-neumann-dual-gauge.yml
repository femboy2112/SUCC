name: Suzuki Neumann dual gauge 30-mode source

on:
  push:
    branches:
      - 'research/suzuki-30mode-neumann-dual-gauge-*'
  pull_request:
    paths:
      - 'observational_succ/suzuki_neumann_dual_gauge.py'
      - 'observational_succ/suzuki_neumann_source_flux.py observational_succ/suzuki_signed_mixed30.py'
      - 'observational_succ/suzuki_signed_mixed30.py'
      - 'tests/test_suzuki_neumann_*.py'
      - 'tests/test_suzuki_signed_mixed30.py'
      - 'research/2026-10-15/SUZUKI_NEUMANN_DUAL_*'
      - '.github/workflows/suzuki-neumann-dual-gauge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic_dual_source:
    name: 30-mode source dual Neumann (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q observational_succ/suzuki_neumann_dual_gauge.py observational_succ/suzuki_neumann_source_flux.py
      - name: True Legendre 30-mode dual gauge, source-normalized flux
        run: |
          python -m unittest discover -s tests -p 'test_suzuki_neumann_dual_gauge.py' -v
          python -m unittest discover -s tests -p 'test_suzuki_neumann_source_flux.py' -v
          python -m unittest discover -s tests -p 'test_suzuki_signed_mixed30.py' -v
      - name: Inherited original source cancellation and Schur shorting
        run: python -m unittest discover -s tests -p 'test_one_object_residual_schur.py' -v
      - name: Original immutable source provenance
        run: python scripts/verify_provenance.py
