name: SUCC swarm isolated proof kernels
on:
  push:
    branches: ['research/many-worlds-*']
  pull_request:
    paths: ['formal/Swarm_*.lean', 'formal/swarm_topology/**', '.github/workflows/swarm-lean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swarm-kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check standalone swarm proofs
        run: |
          lean --version
          for src in formal/Swarm_*.lean; do lean "$src"; done
      - name: Check topology against pinned mathlib
        working-directory: formal/swarm_topology
        run: |
          lake update
          lake exe cache get Mathlib/Topology/Compactness/Compact.lean Mathlib/Topology/Constructions.lean Mathlib/Topology/Separation/Basic.lean
          lake env lean SwarmTopology.lean
          lake env lean SwarmPolicyCompactness.lean
