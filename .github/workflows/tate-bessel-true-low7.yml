name: Tate Bessel authentic seven-low source atlas

on:
  push:
    branches:
      - 'research/tate-bessel-seven-low-schur-*'
  pull_request:
    paths:
      - 'scripts/tate_bessel_true_low7_scan.py'
      - '.github/workflows/tate-bessel-true-low7.yml'

jobs:
  true-source-seven-by-seven:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install mathematical test requirements
        run: python -m pip install -e ".[test]"
      - name: Actual original signed seven by seven low source matrix at Gamma J32
        run: python scripts/tate_bessel_true_low7_scan.py --gamma-modes 32
      - name: Source immutability validation
        run: python scripts/verify_provenance.py
