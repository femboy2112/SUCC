name: Tate central reflection and prime-power jets

on:
  push:
    branches:
      - 'research/tate-central-reflection-prime-jet-*'
  pull_request:
    paths:
      - 'observational_succ/tate_central_reflection.py'
      - 'tests/test_tate_central_reflection.py'
      - 'scripts/tate_central_reflection_probe.py'
      - 'research/2026-10-15/TATE_CENTRAL_REFLECTION_RECEIPT.json'
      - '.github/workflows/tate-central-reflection.yml'

jobs:
  original-reflection-jet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact rational proof and numeric holdout dependencies
        run: python -m pip install -e ".[test]"
      - name: Original source Tate p-local reflection and Gamma Brownian center
        run: python -m unittest discover -s tests -p 'test_tate_central_reflection.py' -v
      - name: Verify original prime-power half-density reflection receipt
        run: python scripts/tate_central_reflection_probe.py --verify
      - name: Inherited conductor/Haar and odd chi3 local Tate source
        run: python -m unittest discover -s tests -p 'test_tate_local_contract.py' -v
      - name: Inherited completed theta/eta analytic and non-Euler controls
        run: python -m unittest discover -s tests -p 'test_tate_eta_bernoulli.py' -v
      - name: Inherited genuine first prime energy and Gamma/source
        run: python -m unittest discover -s tests -p 'test_tate_prime_clock_uv.py' -v
      - name: Inherited APOLLO source-first Brownian prime interference
        run: python -m unittest discover -s tests -p 'test_apollo_source_first_authentic.py' -v
      - name: Verify source provenance and no-zero source dossier
        run: python scripts/verify_provenance.py
