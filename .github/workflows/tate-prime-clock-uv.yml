name: Tate prime-clock UV source positivity

on:
  push:
    branches:
      - 'research/tate-prime-clock-uv-transducer-*'
  pull_request:
    paths:
      - 'observational_succ/tate_prime_clock_uv.py'
      - 'tests/test_tate_prime_clock_uv.py'
      - 'scripts/tate_prime_clock_uv_probe.py'
      - 'research/2026-10-15/TATE_PRIME_CLOCK_UV_RECEIPT.json'
      - '.github/workflows/tate-prime-clock-uv.yml'

jobs:
  original-tate-clock-uv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source-typed mathematical tests
        run: python -m pip install -e ".[test]"
      - name: Execute exact rational and pinned source tests
        run: python -m unittest discover -s tests -p 'test_tate_prime_clock_uv.py' -v
      - name: Reproduce original Weil sparse-cone proof receipt
        run: python scripts/tate_prime_clock_uv_probe.py --verify
      - name: Replay inherited APOLLO K2/K6/K7 source identities
        run: python -m unittest discover -s tests -p 'test_apollo_krein_factor.py' -v
      - name: Validate original imported source provenance
        run: python scripts/verify_provenance.py
