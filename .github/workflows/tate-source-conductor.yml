name: Tate source / conductor checks

on:
  push:
    branches:
      - 'research/tate-source-fourier-conductor-*'
  pull_request:
    paths:
      - 'observational_succ/tate_local_contract.py'
      - 'tests/test_tate_local_contract.py'
      - 'scripts/tate_local_contract_probe.py'
      - '.github/workflows/tate-source-conductor.yml'

jobs:
  tate-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Exact local and completed chi3 tests
        run: python -m unittest discover -s tests -p 'test_tate_local_contract.py' -v
      - name: Deterministic certificate receipt
        run: python scripts/tate_local_contract_probe.py
      - name: Preserve source provenance boundary
        run: python scripts/verify_provenance.py
