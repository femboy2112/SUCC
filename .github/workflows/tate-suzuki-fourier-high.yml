name: Tate Suzuki Fourier high moment Schur

on:
  push:
    branches:
      - 'research/tate-suzuki-fourier-high-moment-*'
  pull_request:
    paths:
      - 'observational_succ/tate_suzuki_fourier_schur.py'
      - 'tests/test_tate_suzuki_fourier_schur.py'
      - 'research/2026-10-15/TATE_SUZUKI_FOURIER_HIGH_MOMENT.md'
      - 'scripts/tate_suzuki_fourier_high_probe.py'
      - '.github/workflows/tate-suzuki-fourier-high.yml'

jobs:
  genuine-source-fourier-schur:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact mathematical tests
        run: python -m pip install -e ".[test]"
      - name: Original gamma Fourier high moments and legendre source
        run: python -m unittest discover -s tests -p 'test_tate_suzuki_fourier_schur.py' -v
      - name: Exact analytic theorem receipt from same original source
        run: python scripts/tate_suzuki_fourier_high_probe.py --verify
      - name: Imported PR109 original signed source shorting and H1 norms
        run: python -m unittest discover -s tests -p 'test_one_object_residual_schur.py' -v
      - name: Preserve PR109 derivative interval cancellation engine
        run: python -m unittest discover -s tests -p 'test_signed_gprime_enclosure.py' -v
      - name: Original Tate eta and prime clock regression
        run: python -m unittest discover -s tests -p 'test_tate_eta_bernoulli.py' -v
      - name: Original APOLLO source identity regression
        run: python -m unittest discover -s tests -p 'test_apollo_krein_factor.py' -v
      - name: Fail closed on imported source provenance
        run: python scripts/verify_provenance.py
