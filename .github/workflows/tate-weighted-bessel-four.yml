name: Tate weighted Bessel four-moment original Weil positivity

on:
  push:
    branches:
      - 'research/tate-weighted-bessel-four-low-*'
  pull_request:
    paths:
      - 'observational_succ/tate_weighted_bessel_four_schur.py'
      - 'tests/test_tate_weighted_bessel_four_schur.py'
      - 'scripts/tate_weighted_bessel_four_probe.py'
      - 'research/2026-10-15/TATE_WEIGHTED_BESSEL_FOUR_RECEIPT.json'
      - '.github/workflows/tate-weighted-bessel-four.yml'

jobs:
  exact-weighted-source-four:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact proof and mathematical test dependencies
        run: python -m pip install -e ".[test]"
      - name: Prove original complete Weil positivity on four moment null tests
        run: python -m unittest discover -s tests -p 'test_tate_weighted_bessel_four_schur.py' -v
      - name: Verify byte-serialized exact-rational weighted spectrum and original source
        run: python scripts/tate_weighted_bessel_four_probe.py --verify
      - name: Preserve authenticated seven-moment Bessel and Neumann low7 results
        run: python -m unittest discover -s tests -p 'test_tate_bessel_seven_schur.py' -v
      - name: Preserve original Tate 1-s prime-power reflection source
        run: python -m unittest discover -s tests -p 'test_tate_central_reflection.py' -v
      - name: Preserve actual signed original Suzuki zero-shift residual machinery
        run: python -m unittest discover -s tests -p 'test_one_object_residual_schur.py' -v
      - name: Preserve completed true-prime Weil window and original Gamma source
        run: python -m unittest discover -s tests -p 'test_tate_prime_clock_uv.py' -v
      - name: Verify immutable original/source Git blob provenance
        run: python scripts/verify_provenance.py
