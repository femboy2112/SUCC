name: Theorem Forge II exact and kernel certificates
on:
  push:
    branches: ['research/theorem-forge-ii-*']
  pull_request:
    paths:
      - 'observational_succ/information_repair.py'
      - 'observational_succ/online_source_games.py'
      - 'observational_succ/finite_euler_rigidity.py'
      - 'observational_succ/forge_operator_transport.py'
      - 'observational_succ/directional_source_inverse.py'
      - 'formal/Forge*.lean'
      - 'research/2026-10-19/**'
      - 'scripts/theorem_forge_probe.py'
      - 'scripts/verify_forge_formal.py'
      - 'scripts/directional_source_inverse_probe.py'
      - 'tests/test_information_repair.py'
      - 'tests/test_online_source_games.py'
      - 'tests/test_finite_euler_rigidity.py'
      - 'tests/test_forge_operator_transport.py'
      - 'tests/test_directional_source_inverse.py'
      - '.github/workflows/theorem-forge-ii.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python scripts/verify_provenance.py
      - name: Exact source games, information repair, arithmetic and operator controls
        run: |
          python -m unittest tests.test_information_repair tests.test_online_source_games tests.test_finite_euler_rigidity tests.test_forge_operator_transport tests.test_directional_source_inverse -v
          python scripts/theorem_forge_probe.py > "$RUNNER_TEMP/forge-finite.json"
          python research/2026-10-19/audit_foundations_acquisition.py > "$RUNNER_TEMP/forge-acquisition-audit.json"
          diff -u research/2026-10-19/FOUNDATIONS_AUDIT_RECEIPT.json "$RUNNER_TEMP/forge-acquisition-audit.json"
          python scripts/directional_source_inverse_probe.py --verify --source-holdouts --reconstruct-pr178 > "$RUNNER_TEMP/forge-directional.json"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-exact-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/forge-finite.json
            ${{ runner.temp }}/forge-acquisition-audit.json
            ${{ runner.temp }}/forge-directional.json
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged pinned Lean
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
      - name: Check actual declarations, axiom manifest and false controls
        run: python scripts/verify_forge_formal.py --lean "$HOME/.elan/bin/lean" --output "$RUNNER_TEMP/forge-kernel.json"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-kernel
          path: ${{ runner.temp }}/forge-kernel.json
