name: SUCC original-theta complex-contour certificates

on:
  push:
    branches:
      - research/xi-complex-contour-weil-residue-2026-10-14
  pull_request:
    paths:
      - 'observational_succ/theta_complex_contour.py'
      - 'observational_succ/theta_suzuki_shadow.py'
      - 'tests/test_theta_complex_contour.py'
      - 'scripts/theta_complex_contour_probe.py'
      - 'research/2026-10-14/THETA_COMPLEX_CONTOUR_RECEIPT.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-theta-contour:
    name: Original theta contour (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact original-source interval arithmetic and hostile controls
        run: python -m unittest discover -s tests -p 'test_theta_complex_contour.py' -v
      - name: Replay complete source-only Rouché and Weil-shadow receipt
        run: python scripts/theta_complex_contour_probe.py --verify research/2026-10-14/THETA_COMPLEX_CONTOUR_RECEIPT.json
