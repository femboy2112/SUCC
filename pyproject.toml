[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observational-succ"
version = "0.3.0"
description = "Causal observation, formal proof and ordinal completion; computational and quantum models with optional number-theory bridges"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["mathematical logic", "computability", "causality", "category theory", "quantum information", "number theory"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# numpy is required only by the Black Sun numerical campaign (PRs #79/#87/#91/#93);
# pinned <3 and >=2.1 so pip resolves per-interpreter (2.2.x on 3.10, 2.5.x on 3.13).
# Its near-zero sampled eigenvalues are TESTED MODEL, never rational positivity certificates.
# sympy is imported only by scripts/suzuki_schur_independent_oracle.py (an independent
# verification oracle, not exercised by CI or any test); declared so `.[test]`/`.[research]`
# genuinely install everything the integrated code imports (Academic Main audit F-note).
# scipy supplies the independent full-source derivative quadrature in the
# Proof Teeth Schur probe; numerical quadrature is not an interval certificate.
research = ["mpmath>=1.3,<2", "numpy>=2.1,<3", "sympy>=1.12,<2", "scipy>=1.14,<2"]
test = ["mpmath>=1.3,<2", "numpy>=2.1,<3", "sympy>=1.12,<2", "scipy>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["observational_succ*"]
exclude = ["tests*", "research*", "provenance*", "docs*"]

[tool.setuptools]
include-package-data = false
