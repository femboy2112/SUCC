[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observational-succ"
version = "0.3.0"
description = "Causal observation, formal proof and ordinal completion; computational and quantum models with optional number-theory bridges"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["mathematical logic", "computability", "causality", "category theory", "quantum information", "number theory"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
research = ["mpmath>=1.3,<2"]
test = ["mpmath>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["observational_succ*"]
exclude = ["tests*", "research*", "provenance*", "docs*"]

[tool.setuptools]
include-package-data = false
